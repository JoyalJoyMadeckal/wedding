<script>
/* ═══════════════════════════════════════════════════════════
   Renders wedding.json + photos.json.
   All content and colour lives in the JSON, not here.
   ═══════════════════════════════════════════════════════════ */

const PLACEHOLDER =
  "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1000'%3E" +
  "%3Crect width='800' height='1000' fill='%23DFCCB1'/%3E%3Ctext x='400' y='512' " +
  "font-family='Georgia,serif' font-size='34' fill='%23846044' text-anchor='middle'%3EPhoto%3C/text%3E%3C/svg%3E";

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

/* Photo tags come from folder names on disk but photoTag is typed by hand in
   wedding.json, so "Wedding" and "wedding" must mean the same thing. */
function norm(s) { return String(s == null ? "" : s).trim().toLowerCase(); }
function sameTag(a, b) { return norm(a) === norm(b); }

/* folders under originals/ that feed the page but never a slideshow */
const RESERVED_TAGS = new Set(["dresscode"]);

/* escape first, then allow **bold**, *italic*, [text](url), newlines */
function rich(node, str) {
  if (!str) { node.textContent = ""; return node; }
  node.innerHTML = String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+|mailto:[^)\s]+|tel:[^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\n/g, "<br>");
  return node;
}

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* ── slideshow ─────────────────────────────────────────── */
function slideshow(frame, photos, opts) {
  const { interval = 6000, dots = false } = opts || {};
  const list = photos && photos.length ? photos : [{ jpg: PLACEHOLDER, alt: "" }];
  const stage = el("div", "slides");

  const layers = list.map((p, i) => {
    const pic = el("picture");
    if (p.webp) { const s = el("source"); s.srcset = p.webp; s.type = "image/webp"; pic.append(s); }
    const img = el("img");
    img.src = p.jpg; img.alt = p.alt || "";
    img.loading = i < 2 ? "eager" : "lazy"; img.decoding = "async";
    img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; };
    pic.append(img);
    if (i === 0) pic.classList.add("is-active");
    stage.append(pic);
    return pic;
  });
  frame.append(stage);
  if (list.length < 2) return;

  const reduce = !!(window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  let index = 0, timer = null, paused = false, dotEls = [];

  const show = n => {
    index = (n + layers.length) % layers.length;
    layers.forEach((p, i) => p.classList.toggle("is-active", i === index));
    dotEls.forEach((d, i) => d.setAttribute("aria-current", String(i === index)));
  };
  const start = () => { if (!reduce && !paused && !timer) timer = setInterval(() => show(index + 1), interval); };
  const stop = () => { clearInterval(timer); timer = null; };

  if (dots) {
    const wrap = el("div", "stagedots");
    dotEls = list.map((_, i) => {
      const d = el("button", "sdot"); d.type = "button";
      d.setAttribute("aria-label", "Photo " + (i + 1) + " of " + list.length);
      d.onclick = () => { stop(); show(i); start(); };
      wrap.append(d); return d;
    });
    frame.append(wrap);
  }

  let x0 = null;
  frame.addEventListener("pointerdown", e => { x0 = e.clientX; });
  frame.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { stop(); show(index + (dx < 0 ? 1 : -1)); start(); }
  });
  frame.addEventListener("mouseenter", () => { paused = true; stop(); });
  frame.addEventListener("mouseleave", () => { paused = false; start(); });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());

  show(0); start();
}

/* ── accent colour per event ───────────────────────────── */
function accentVars(node, name) {
  const known = ["sage", "rose", "tan", "terracotta"];
  const key = known.indexOf(name) >= 0 ? name : "terracotta";
  node.style.setProperty("--accent", "var(--" + key + ")");
  node.style.setProperty("--accent-deep", "var(--" + key + "-deep)");
}

/* ── left panel ────────────────────────────────────────── */
function buildStage(data, photos, fns) {
  const stage = el("aside", "stage");
  slideshow(stage, photos, { interval: (data.stage && data.stage.slideSeconds || 6) * 1000, dots: true });
  stage.append(el("div", "scrim"));

  const plate = el("div", "plate");
  const inv = data.invitation || {};
  if (inv.preamble) plate.append(rich(el("p", "preamble"), inv.preamble));

  const h1 = el("h1", "names");
  h1.append(document.createTextNode(data.couple.partnerOne + " "));
  h1.append(el("span", "joiner", data.couple.joiner || "and"));
  h1.append(document.createTextNode(" " + data.couple.partnerTwo));
  plate.append(h1);

  if (fns.length) {
    const d = el("p", "dates");
    fns.forEach((f, i) => {
      if (i) d.append(el("i", null, " · "));
      d.append(el("span", null, f.shortDate || f.dateLabel || ""));
    });
    plate.append(d);
  }
  stage.append(plate);
  return stage;
}

/* ── jump nav ──────────────────────────────────────────── */
function buildJump(fns, data) {
  const nav = el("nav", "jump");
  nav.setAttribute("aria-label", "Sections");
  fns.forEach(f => {
    const a = el("a", null, f.navLabel || f.name);
    a.href = "#" + slug(f.id || f.name);
    nav.append(a);
  });
  if (data.details) {
    const a = el("a", null, data.details.navLabel || "Good to know");
    a.href = "#details"; nav.append(a);
  }
  if (data.rsvp) {
    const a = el("a", null, data.rsvp.navLabel || "RSVP");
    a.href = "#rsvp"; nav.append(a);
  }
  if (giftsOn(data)) {
    const a = el("a", null, data.gifts.navLabel || "Gifts");
    a.href = "#gifts"; nav.append(a);
  }
  return nav;
}

/* ── opening ───────────────────────────────────────────── */
function buildOpening(data, fns) {
  const s = el("section", "opening");
  const inv = data.invitation || {};
  if (inv.lead) s.append(rich(el("p", "lead"), inv.lead));
  if (inv.body) s.append(rich(el("p"), inv.body));
  const c = countdown(fns);
  if (c) s.append(el("p", "countdown", c));
  return s;
}

function countdown(fns) {
  const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = midnight(new Date());
  const upcoming = fns
    .map(f => ({ f: f, d: new Date(f.date) }))
    .filter(x => !isNaN(x.d) && midnight(x.d) >= today)
    .sort((a, b) => a.d - b.d)[0];
  if (!upcoming) return fns.length ? "Thank you for celebrating with us" : "";
  const days = Math.round((midnight(upcoming.d) - today) / 86400000);
  const what = (upcoming.f.countdownLabel || upcoming.f.name).toLowerCase();
  if (days === 0) return "Today — the " + what;
  if (days === 1) return "Tomorrow — the " + what;
  return days + " days until the " + what;
}

/* ── one event card ────────────────────────────────────── */
function buildFunction(fn, photos) {
  const s = el("section", "fn");
  s.id = slug(fn.id || fn.name);
  accentVars(s, fn.accent);

  const tag = fn.photoTag !== undefined ? fn.photoTag : fn.id;
  const pics = photos.filter(p => sameTag(p.tag, tag));
  if (pics.length) {
    const arch = el("div", "arch");
    slideshow(arch, pics, { interval: (fn.slideSeconds || 7) * 1000 });
    s.append(arch);
  }

  const b = el("div", "fn-body");
  if (fn.kicker) b.append(el("p", "fn-kicker", fn.kicker));
  b.append(el("h2", null, fn.name));
  if (fn.tagline) b.append(rich(el("p", "tagline"), fn.tagline));
  if (fn.dateLabel) b.append(el("p", "fn-when", fn.dateLabel));
  if (fn.time) b.append(el("p", "fn-time", fn.time));

  /* One location is the common case, so a plain venue/address/mapUrl on the
     event still works. Add a "venues" array when an event moves between
     places — ceremony at the church, reception at the hall. */
  const places = (fn.venues && fn.venues.length)
    ? fn.venues
    : [{ venue: fn.venue, address: fn.address, mapUrl: fn.mapUrl, mapLabel: fn.mapLabel }];

  places.forEach(v => {
    if (!v.venue && !v.address && !v.mapUrl) return;
    const box = el("div", places.length > 1 ? "fn-venue" : null);
    if (v.label) box.append(el("p", "fn-vlabel", v.label));
    if (v.venue || v.address) {
      const w = el("p", "fn-where");
      if (v.venue) { w.append(el("strong", null, v.venue)); w.append(el("br")); }
      if (v.address) w.append(document.createTextNode(v.address));
      box.append(w);
    }
    if (v.time) box.append(el("p", "fn-vtime", v.time));
    if (v.mapUrl) {
      const a = el("a", "maplink", v.mapLabel || fn.mapLabel || "Open in Maps");
      a.href = v.mapUrl; a.rel = "noopener";
      box.append(a);
    }
    b.append(box);
  });

  if (fn.note) b.append(rich(el("p", "fn-where"), fn.note));

  if (fn.tags && fn.tags.length) {
    const t = el("div", "fn-tags");
    fn.tags.forEach(x => t.append(el("span", "tag", x)));
    b.append(t);
  }
  s.append(b);
  return s;
}

/* ── shared details ────────────────────────────────────── */
/* An item's "description" can be three things, so each gets its own renderer:
     a string   -> a paragraph
     an array   -> one block per entry (the dress code, one per event)
     an object  -> a key/value list (getting there: parking, airport, …)     */
function buildDetails(d) {
  const s = el("section", "section-head");
  s.id = "details";
  s.append(el("h2", null, d.title || "Good to know"));
  if (d.intro) s.append(rich(el("p"), d.intro));

  const dl = el("dl", "facts");
  (d.items || []).forEach(it => {
    const row = el("div");
    row.append(el("dt", null, it.term));
    const dd = el("dd");
    describe(dd, it.description);
    if (it.album && it.album.url) dd.append(buildAlbum(it.album));
    row.append(dd);
    dl.append(row);
  });
  s.append(dl);
  return s;
}

function describe(dd, value) {
  if (value == null) return;

  if (Array.isArray(value)) {
    value.forEach(entry => dd.append(buildWear(entry)));
    return;
  }
  if (typeof value === "object") {
    const ul = el("ul", "kv");
    Object.keys(value).forEach(k => {
      if (!value[k]) return;
      const li = el("li");
      li.append(el("span", "kv-k", titleCase(k)));
      li.append(rich(el("span", "kv-v"), value[k]));
      ul.append(li);
    });
    if (ul.children.length) dd.append(ul);
    return;
  }
  dd.append(rich(el("p"), value));
}

function titleCase(k) {
  return String(k).replace(/([a-z])([A-Z])/g, "$1 $2")
                  .replace(/[_-]+/g, " ")
                  .replace(/^./, c => c.toUpperCase());
}

/* One event's dress code: the words first, then the artwork. The image is a
   button so it opens full-screen — at column width the palette labels baked
   into it are far too small to read. */
function buildWear(entry) {
  const box = el("div", "wear");
  if (entry.label) box.append(el("p", "wear-label", entry.label));
  if (entry.dresscode) {
    const p = el("p", "wear-line");
    p.append(el("span", "wear-k", "Dress code"));
    p.append(rich(el("span"), entry.dresscode));
    box.append(p);
  }
  if (entry.colortheme) {
    const p = el("p", "wear-line");
    p.append(el("span", "wear-k", "Colours"));
    p.append(rich(el("span"), entry.colortheme));
    box.append(p);
  }

  if (entry.image) {
    const alt = entry.imageAlt || ((entry.label || "") + " dress code");
    const btn = el("button", "wear-fig");
    btn.type = "button";
    btn.setAttribute("aria-label", alt + " — tap to enlarge");

    const pic = el("picture");
    if (entry.imageWebp) {
      const src = el("source");
      src.srcset = entry.imageWebp; src.type = "image/webp";
      pic.append(src);
    }
    const img = el("img");
    img.src = entry.image; img.alt = alt; img.loading = "lazy"; img.decoding = "async";
    pic.append(img);

    btn.append(pic, el("span", "wear-zoom", entry.zoomLabel || "Tap to enlarge"));
    btn.addEventListener("click", () => openLightbox(entry.image, alt));
    box.append(btn);
  }
  return box;
}

/* Shared photo album. On a phone the link is enough — you can't scan the
   screen you're holding — so the QR is desktop-only, via CSS. */
function buildAlbum(a) {
  const wrap = el("div", "album");

  const link = el("a", "album-link", a.label || "Add your photos");
  link.href = a.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.append(el("span", "ext", "↗"));
  wrap.append(link);

  const qr = el("img", "album-qr");
  qr.src = "photos/album-qr.png";
  qr.alt = "QR code linking to the shared photo album";
  qr.loading = "lazy";
  qr.width = 480; qr.height = 480;
  qr.onerror = () => qr.remove();
  wrap.append(qr);

  if (a.qrCaption) wrap.append(el("p", "album-cap", a.qrCaption));
  return wrap;
}

/* ── lightbox ──────────────────────────────────────────── */
let lightboxEl = null, lastFocus = null;

function openLightbox(src, alt) {
  lastFocus = document.activeElement;
  if (!lightboxEl) lightboxEl = makeLightbox();
  const img = lightboxEl.querySelector("img");
  img.src = src; img.alt = alt || "";
  lightboxEl.hidden = false;
  document.body.style.overflow = "hidden";
  lightboxEl.querySelector(".lb-close").focus();
}

function closeLightbox() {
  if (!lightboxEl) return;
  lightboxEl.hidden = true;
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function makeLightbox() {
  const box = el("div", "lb");
  box.hidden = true;
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");

  const close = el("button", "lb-close", "✕");
  close.type = "button";
  close.setAttribute("aria-label", "Close");
  close.addEventListener("click", closeLightbox);

  const img = el("img");
  box.append(close, img);

  // backdrop click closes; clicking the picture itself should not
  box.addEventListener("click", e => { if (e.target === box) closeLightbox(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !box.hidden) closeLightbox();
  });

  document.body.append(box);
  return box;
}

/* ── gifts ─────────────────────────────────────────────── */
/* Built only when a UPI id (or a full link) is set — see giftsOn(). */
function upiLink(g) {
  const u = g.upi || {};
  if (u.link) return u.link;
  if (!u.id) return "";
  const q = new URLSearchParams({ pa: u.id, cu: "INR" });
  if (u.name) q.set("pn", u.name);
  if (u.note) q.set("tn", u.note);
  return "upi://pay?" + q.toString();
}

function giftsOn(data) {
  const g = data.gifts;
  return !!(g && (upiLink(g) || g.url));
}

/* Order follows the wording in wedding.json: registry first ("we've put
   together a little registry"), then UPI ("if the registry didn't quite do
   it for you"). Either half disappears if its URL / id is blank. */
function buildGifts(g) {
  const s = el("section", "section-head");
  s.id = "gifts";
  s.append(el("h2", null, g.title || "Gifts"));
  if (g.intro) s.append(rich(el("p"), g.intro));

  const box = el("div", "gift");

  /* ── the registry, hosted elsewhere ── */
  if (g.url) {
    if (g.body) box.append(rich(el("p"), g.body));
    const label = g.registryLabel || "Open our registry";
    const a = el("a", "gift-reg", label);
    a.href = g.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.append(el("span", "ext", "↗"));
    a.setAttribute("aria-label", label + " (opens in a new tab)");
    box.append(a);
  } else if (g.body) {
    box.append(rich(el("p"), g.body));
  }

  /* ── UPI ── */
  const href = upiLink(g);
  if (href) {
    const alt = el("div", g.url ? "gift-alt" : null);
    if (g.description) alt.append(rich(el("p", "gift-alt-lead"), g.description));

    /* Touch devices get a link that opens their UPI app. Desktop can't do
       anything with that, so CSS swaps in the QR — you can't scan the screen
       you're holding. */
    const a = el("a", "btn", g.buttonLabel || "Open your UPI app");
    a.href = href;
    a.rel = "nofollow";
    alt.append(a);

    const qr = el("img", "gift-qr");
    qr.src = "photos/upi-qr.png";
    qr.alt = "UPI payment QR code";
    qr.loading = "lazy";
    qr.width = 480; qr.height = 480;
    qr.onerror = () => qr.remove();       // build.py hasn't generated it yet
    alt.append(qr);

    if (g.qrCaption) alt.append(el("p", "gift-cap", g.qrCaption));

    /* The fallback for when the QR won't scan and the deep link doesn't fire
       (iOS is unreliable). The id itself stays off the page — it's only put on
       screen if the clipboard turns out to be unavailable. */
    const id = (g.upi || {}).id;
    if (id) {
      const label = g.copyLabel || "Copy UPI ID";
      const copy = el("button", "gift-copy", label);
      copy.type = "button";

      copy.addEventListener("click", async () => {
        let ok = false;
        try {
          await navigator.clipboard.writeText(id);
          ok = true;
        } catch (err) {
          const t = el("textarea");               // older browsers, and http://
          t.value = id;
          t.style.position = "fixed"; t.style.opacity = "0";
          document.body.append(t); t.select();
          try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
          t.remove();
        }

        if (ok) {
          copy.textContent = g.copied || "Copied";
          setTimeout(() => { copy.textContent = label; }, 1800);
        } else if (!alt.querySelector(".gift-reveal")) {
          // last resort: show it so they can select it by hand
          copy.textContent = g.copyFailed || "Copy it from here";
          alt.append(el("p", "gift-reveal", id));
        }
      });

      alt.append(copy);
      if (g.copyHint) alt.append(rich(el("p", "gift-hint"), g.copyHint));
    }
    box.append(alt);
  }

  if (g.footnote) box.append(rich(el("p", "gift-foot"), g.footnote));

  s.append(box);
  return s;
}

/* ── RSVP, one block per event ─────────────────────────── */
function buildRsvp(r, fns) {
  const s = el("section", "section-head");
  s.id = "rsvp";
  s.append(el("h2", null, r.title || "Will you join us?"));
  if (r.intro) s.append(rich(el("p"), r.intro));

  const L = r.labels || {};
  const form = el("form");
  form.id = "rsvpForm"; form.name = "rsvp"; form.method = "POST";
  if ((r.mode || "netlify") === "netlify") {
    form.setAttribute("data-netlify", "true");
    form.setAttribute("netlify-honeypot", "bot-field");
    const hid = el("input"); hid.type = "hidden"; hid.name = "form-name"; hid.value = "rsvp";
    form.append(hid);
  }
  const hp = el("p", "honeypot");
  hp.innerHTML = '<label>Leave this empty <input name="bot-field" tabindex="-1"></label>';
  form.append(hp);

  const textField = (id, name, label, type, req, attrs) => {
    const f = el("div", "field");
    const l = el("label", null, label); l.htmlFor = id;
    const i = type === "textarea" ? el("textarea") : el("input");
    if (type !== "textarea") i.type = type || "text";
    i.id = id; i.name = name; i.required = !!req;
    if (attrs) Object.assign(i, attrs);
    f.append(l, i);
    return f;
  };

  form.append(textField("gName", "name", L.name || "Your name", "text", true, { autocomplete: "name" }));
  form.append(textField("gEmail", "email", L.email || "Email", "email", true, { autocomplete: "email" }));

  fns.forEach(fn => {
    const key = slug(fn.id || fn.name);
    const block = el("div", "rsvp-fn");
    accentVars(block, fn.accent);

    const fs = el("fieldset");
    const lg = el("legend");
    lg.append(el("h3", null, fn.name));
    fs.append(lg);
    fs.append(el("p", "sub", [fn.shortDate || fn.dateLabel, fn.venue].filter(Boolean).join(" · ")));

    const ch = el("div", "choices");
    [[L.yes || "Joyfully yes", "yes"], [L.no || "Sadly no", "no"]].forEach((pair, i) => {
      const lab = el("label", "choice");
      const inp = el("input");
      inp.type = "radio"; inp.name = key + "_attending"; inp.value = pair[1];
      inp.required = i === 0;
      lab.append(inp, document.createTextNode(" " + pair[0]));
      ch.append(lab);
    });
    fs.append(ch);

    const hc = el("div", "headcount");
    const hl = el("label", null, L.headcount || "How many of you?");
    hl.htmlFor = key + "_guests";
    const hi = el("input");
    hi.type = "number"; hi.id = key + "_guests"; hi.name = key + "_guests";
    hi.min = 0; hi.max = Number(r.maxGuests) || 4; hi.value = 1;
    hc.append(hl, hi);
    fs.append(hc);

    // dim the headcount once they've said no
    ch.addEventListener("change", e => {
      const no = e.target.value === "no";
      hi.disabled = no;
      if (no) hi.value = 0;
      else if (Number(hi.value) === 0) hi.value = 1;
      hc.style.opacity = no ? ".45" : "1";
    });

    // typing past the cap is possible even with max set, so clamp on the way out
    hi.addEventListener("input", () => {
      const cap = Number(hi.max);
      if (Number(hi.value) > cap) hi.value = cap;
    });

    block.append(fs);
    form.append(block);
  });

  /* These three are optional. Delete a label from rsvp.labels in wedding.json
     and the field disappears from the form. */
  if (L.dietary) form.append(textField("gDiet", "dietary", L.dietary));
  if (L.song) form.append(textField("gSong", "song", L.song));
  if (L.message) form.append(textField("gNote", "message", L.message, "textarea"));

  const btn = el("button", "btn", L.submit || "Send reply");
  btn.type = "submit";
  form.append(btn);

  const status = el("p", "formstatus");
  status.id = "formStatus";
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");
  form.append(status);
  if (r.note) form.append(rich(el("p", "formnote"), r.note));

  wireForm(form, status, btn, r);
  s.append(form);
  return s;
}

function wireForm(form, status, btn, r) {
  const mode = r.mode || "netlify";
  if (mode === "none") return;

  const endpoints = {
    formspree: r.formspreeEndpoint,
    gsheet: r.sheetEndpoint,
    netlify: "/"
  };
  const endpoint = endpoints[mode] || "/";
  const msg = r.messages || {};

  if ((mode === "formspree" || mode === "gsheet") &&
      (!endpoint || /PLACEHOLDER/.test(endpoint))) {
    console.warn("RSVP: rsvp." + (mode === "gsheet" ? "sheetEndpoint" : "formspreeEndpoint") +
                 " is not set in wedding.json — replies will go nowhere.");
  }

  /* Google Apps Script accepts a urlencoded POST without a CORS preflight.
     If the browser still blocks reading the response, resend opaquely — the
     row lands in the sheet either way, we just can't see the confirmation. */
  async function send(body) {
    if (mode !== "gsheet") {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: mode === "formspree" ? { Accept: "application/json" } : {},
        body: mode === "formspree" ? body.fd : body.qs
      });
      if (!res.ok) throw new Error(res.status);
      return;
    }
    try {
      const res = await fetch(endpoint, { method: "POST", body: body.qs, redirect: "follow" });
      if (!res.ok) throw new Error(res.status);
    } catch (err) {
      await fetch(endpoint, { method: "POST", mode: "no-cors", body: body.qs });
    }
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    btn.disabled = true;
    status.textContent = msg.sending || "Sending…";
    try {
      const fd = new FormData(form);
      if (mode === "gsheet") fd.append("submittedAt", new Date().toISOString());
      await send({ fd, qs: new URLSearchParams(fd) });
      form.reset();
      form.querySelectorAll("input[type=number]").forEach(i => {
        i.disabled = false;
        i.closest(".headcount") && (i.closest(".headcount").style.opacity = "1");
      });
      status.textContent = msg.sent || "Thank you — we've got your reply.";
    } catch (err) {
      status.textContent = msg.failed ||
        "That didn't send. Please email us instead and we'll add you by hand.";
    }
    btn.disabled = false;
  });
}

function buildFooter(data) {
  const f = el("footer", "foot");
  (data.contacts || []).forEach(c => {
    const bits = [];
    if (c.name) bits.push(c.name);
    if (c.phone) bits.push("[" + c.phone + "](tel:" + c.phone.replace(/[^\d+]/g, "") + ")");
    if (c.email) bits.push("[" + c.email + "](mailto:" + c.email + ")");
    f.append(rich(el("p"), bits.join(" · ")));
  });
  f.append(el("p", "mark", data.couple.partnerOne + " & " + data.couple.partnerTwo));
  return f;
}

function applyTheme(t) {
  if (!t) return;
  const map = {
    sage: "--sage", rose: "--rose", tan: "--tan", beige: "--beige",
    terracotta: "--terracotta", sageDeep: "--sage-deep", roseDeep: "--rose-deep",
    tanDeep: "--tan-deep", terracottaDeep: "--terracotta-deep",
    paper: "--paper", paperWarm: "--paper-warm", ink: "--ink",
    muted: "--muted", hairline: "--hairline"
  };
  Object.keys(map).forEach(k => {
    if (t[k]) document.documentElement.style.setProperty(map[k], t[k]);
  });
}

/* ── boot ──────────────────────────────────────────────── */
(async function () {
  const app = document.getElementById("app");
  const boot = document.getElementById("boot");

  const load = async (url, optional) => {
    const res = await fetch(url + "?v=" + Date.now());
    if (!res.ok) {
      if (optional) return null;
      throw new Error(url + " returned " + res.status);
    }
    return res.json();
  };

  let data, photoData;
  try {
    data = await load("wedding.json");
    photoData = await load("photos.json", true);
  } catch (err) {
    boot.innerHTML = location.protocol === "file:"
      ? "This page reads its content from JSON, which browsers block on <code>file://</code>.<br>" +
        "Run <code>python build.py --serve</code> in this folder, then open <code>http://localhost:8000</code>."
      : "Couldn't load <code>wedding.json</code>. Check it sits next to this file and that the JSON is valid." +
        "<br><small>" + err.message + "</small>";
    return;
  }

  const allPhotos = (photoData && photoData.photos) || [];
  applyTheme(data.theme);
  if (data.site && data.site.lang) document.documentElement.lang = data.site.lang;

  // ?for=ring — show only that event, so you can send a different link per guest group
  const wanted = new URLSearchParams(location.search).get("for");
  let fns = data.functions || [];
  if (wanted) {
    const keep = wanted.split(",").map(x => x.trim().toLowerCase());
    const subset = fns.filter(f => keep.indexOf(String(f.id).toLowerCase()) >= 0);
    if (subset.length) fns = subset;
  }

  // stage photos: the untagged ones, or everything if nothing sits loose
  const stagePhotos = (function () {
    if (data.stage && data.stage.photoTag !== undefined)
      return allPhotos.filter(p => sameTag(p.tag, data.stage.photoTag));
    const loose = allPhotos.filter(p => !p.tag);
    // falling back to "everything" must not drag in the dress-code artwork
    return loose.length ? loose : allPhotos.filter(p => !RESERVED_TAGS.has(norm(p.tag)));
  })();

  app.replaceChildren();
  app.append(buildStage(data, stagePhotos, fns));

  const detail = el("div", "detail");
  detail.append(buildJump(fns, data));
  const inner = el("div", "inner");
  inner.append(buildOpening(data, fns));
  fns.forEach(fn => inner.append(buildFunction(fn, allPhotos)));
  if (data.details) inner.append(buildDetails(data.details));
  if (data.rsvp) inner.append(buildRsvp(data.rsvp, fns));
  if (giftsOn(data)) inner.append(buildGifts(data.gifts));
  inner.append(buildFooter(data));
  detail.append(inner);
  app.append(detail);
})();
</script>
